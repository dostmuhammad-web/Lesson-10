<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Modern Gradient Background -->
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base (Squirkle / Rounded Rectangle) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#apexGrad)" filter="url(#dropShadow)" />

  <!-- White Graduation Cap + Letter "A" Stylized Icon -->
  <g transform="translate(116, 128)" fill="#ffffff">
    <!-- Cap Diamond / Rhombus -->
    <polygon points="140,0 280,64 140,128 0,64" />
    
    <!-- Cap Neck / Skull cap -->
    <path d="M56,89.6 V160 C56,192 93.6,208 140,208 C186.4,208 224,192 224,160 V89.6 L140,128 Z" />
    
    <!-- Tassel string and ribbon -->
    <path d="M246.4,78.4 L252,144 C252,156.8 243.6,166.4 235.2,166.4 C226.8,166.4 221.2,156.8 221.2,144 Z" opacity="0.85" />
  </g>

  <!-- Stylized inner Letter A emblem -->
  <path d="M228,260 L284,260 L298,300 L340,300 L286,160 L226,160 L172,300 L214,300 Z M256,192 L276,240 L236,240 Z" fill="#ffffff" opacity="0.9" />
</svg>